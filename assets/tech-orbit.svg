<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="380" rx="18" fill="#060607" stroke="#540010"/>
<text x="44" y="38" font-family="monospace" font-size="19" fill="#ff334f">TECHNOLOGY ORBIT // CATEGORIES BY PURPOSE</text>
<g transform="translate(600 200)">
<circle r="62" fill="#170005" stroke="#ff314f" stroke-width="3" filter="url(#glow)"/>
<text y="-5" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#fff">RX</text><text y="22" text-anchor="middle" font-family="monospace" font-size="14" fill="#ff7184">CORE</text>
<g fill="none" stroke="#5d0011" opacity=".7"><ellipse rx="210" ry="78" stroke-dasharray="8 14"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/></ellipse><ellipse rx="300" ry="125" stroke-dasharray="4 16"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="18s" repeatCount="indefinite"/></ellipse></g>
<g font-family="monospace" font-size="15" text-anchor="middle">
<g transform="translate(-300 -8)"><circle r="35" fill="#120004" stroke="#ff314f"/><text y="5" fill="#ff7184">FRONTEND</text><animateTransform attributeName="transform" type="translate" values="-300 -8;-285 -20;-300 -8" dur="3s" repeatCount="indefinite"/></g>
<g transform="translate(300 8)"><circle r="35" fill="#120004" stroke="#d60027"/><text y="5" fill="#ff7184">BACKEND</text><animateTransform attributeName="transform" type="translate" values="300 8;285 20;300 8" dur="3.4s" repeatCount="indefinite"/></g>
<g transform="translate(-210 126)"><circle r="35" fill="#120004" stroke="#b00020"/><text y="5" fill="#ff7184">DATA</text><animateTransform attributeName="transform" type="translate" values="-210 126;-220 112;-210 126" dur="3.8s" repeatCount="indefinite"/></g>
<g transform="translate(210 -126)"><circle r="35" fill="#120004" stroke="#8b0018"/><text y="5" fill="#ff7184">DEVOPS</text><animateTransform attributeName="transform" type="translate" values="210 -126;220 -112;210 -126" dur="4.1s" repeatCount="indefinite"/></g>
<g transform="translate(-80 -142)"><circle r="33" fill="#120004" stroke="#ff314f"/><text y="5" fill="#ff7184">MOBILE</text></g><g transform="translate(80 142)"><circle r="33" fill="#120004" stroke="#d60027"/><text y="5" fill="#ff7184">CLOUD</text></g><g transform="translate(-245 -110)"><circle r="33" fill="#120004" stroke="#b00020"/><text y="5" fill="#ff7184">SYSTEMS</text></g><g transform="translate(245 110)"><circle r="33" fill="#120004" stroke="#8b0018"/><text y="5" fill="#ff7184">TOOLING</text></g>
</g></g></svg>