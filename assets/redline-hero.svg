<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#010102"/><stop offset=".3" stop-color="#0a0002"/>
    <stop offset=".62" stop-color="#280006"/><stop offset=".82" stop-color="#620013"/>
    <stop offset="1" stop-color="#08080a"/>
  </linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#ff2443" stop-opacity=".34"/><stop offset=".5" stop-color="#a90020" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="430" rx="20" fill="url(#bg)"/>
<ellipse cx="600" cy="180" rx="360" ry="220" fill="url(#halo)">
  <animate attributeName="rx" values="290;420;290" dur="4.4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".55;1;.55" dur="4.4s" repeatCount="indefinite"/>
</ellipse>
<g fill="none" stroke="#ff2e4d" opacity=".28">
  <ellipse cx="600" cy="185" rx="330" ry="118" stroke-dasharray="14 18">
    <animateTransform attributeName="transform" type="rotate" values="0 600 185;360 600 185" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="600" cy="185" rx="270" ry="155" stroke-dasharray="5 17">
    <animateTransform attributeName="transform" type="rotate" values="360 600 185;0 600 185" dur="9s" repeatCount="indefinite"/>
  </ellipse>
</g>
<circle cx="600" cy="185" r="115" fill="none" stroke="#ff314f" stroke-opacity=".18">
  <animate attributeName="r" values="100;130;100" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="stroke-opacity" values=".07;.34;.07" dur="2.8s" repeatCount="indefinite"/>
</circle>
<g text-anchor="middle" font-family="monospace" font-weight="700" filter="url(#g)">
  <text x="600" y="190" font-size="96" fill="#ff2f4d">OLD-RX</text>
  <text x="600" y="190" font-size="96" fill="#fff" opacity=".86">
    <animateTransform attributeName="transform" type="translate" values="0 0;-4 0;5 0;-2 0;3 0;0 0" dur=".86s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".86;.18;.92;.42;.86" dur=".86s" repeatCount="indefinite"/>
  </text>
</g>
<text x="600" y="240" text-anchor="middle" font-family="monospace" font-size="25" fill="#ff8798">RX-DEVELOPMENT // REDLINE APEX</text>
<rect x="0" y="-8" width="1200" height="5" fill="#ff3452">
  <animate attributeName="y" values="-8;435;-8" dur="2.9s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".05;.85;.05" dur="2.9s" repeatCount="indefinite"/>
</rect>
<g font-family="monospace" font-size="15" fill="#ff5570">
  <text x="36" y="40">NODE://OLD-RX</text><text x="965" y="40">ACCESS://ROOT</text>
  <text x="36" y="394">SIGNAL://99.9%</text><text x="972" y="394">STATE://ONLINE</text>
</g>
<text x="600" y="315" text-anchor="middle" font-family="monospace" font-size="15" fill="#a64a5b">BOOTING REDLINE CORE</text>
<rect x="180" y="333" width="840" height="9" rx="5" fill="#2a0007"/>
<rect x="180" y="333" width="1" height="9" rx="5" fill="#ff314f">
  <animate attributeName="width" values="0;840;840;0" keyTimes="0;.68;.84;1" dur="4.4s" repeatCount="indefinite"/>
</rect>
<rect x="1" y="1" width="1198" height="428" rx="20" fill="none" stroke="#5c0011" stroke-width="2"/>
</svg>