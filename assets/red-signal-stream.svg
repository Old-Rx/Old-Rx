<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170">
  <rect width="1200" height="170" fill="#060606"/>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3851" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff3851" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff3851" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g font-family="monospace" font-size="16" fill="#ff3149" opacity=".75">
    <text x="40" y="-20">01 RX 0D FF 13 37<animate attributeName="y" values="-20;210" dur="2.8s" repeatCount="indefinite"/></text>
    <text x="180" y="-60">DE AD BE EF RX<animate attributeName="y" values="-60;210" dur="3.4s" repeatCount="indefinite"/></text>
    <text x="330" y="-30">BUILD DEBUG SHIP<animate attributeName="y" values="-30;210" dur="2.5s" repeatCount="indefinite"/></text>
    <text x="500" y="-90">7A 00 14 FF 31<animate attributeName="y" values="-90;210" dur="3.8s" repeatCount="indefinite"/></text>
    <text x="650" y="-10">OLD RX ROOT 01<animate attributeName="y" values="-10;210" dur="2.9s" repeatCount="indefinite"/></text>
    <text x="820" y="-50">RX DEVELOPMENT<animate attributeName="y" values="-50;210" dur="3.2s" repeatCount="indefinite"/></text>
    <text x="1010" y="-75">FF 1F 1F 00<animate attributeName="y" values="-75;210" dur="2.6s" repeatCount="indefinite"/></text>
  </g>
  <rect width="1200" height="170" fill="url(#fade)" opacity=".08"/>
  <text x="600" y="92" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700" fill="#fff">
    RED SIGNAL STREAM
    <animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/>
  </text>
</svg>