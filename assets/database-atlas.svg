<svg xmlns="http://www.w3.org/2000/svg" width="330" height="300" viewBox="0 0 330 300">
<rect width="330" height="300" rx="18" fill="#06070b" stroke="#415171"/>
<text x="42" y="38" font-family="monospace" font-size="18" fill="#ff3150">DATABASE ATLAS // STORAGE STRATEGIES</text>
<rect x="62" y="92" width="252" height="148" rx="12" fill="#131118" stroke="#ff3150"/><text x="80" y="120" font-family="monospace" font-size="18" fill="#ff92a6">SQL</text><text x="80" y="144" font-family="monospace" font-size="13" fill="#ffe7ec">MySQL / PostgreSQL</text><text x="80" y="162" font-family="monospace" font-size="13" fill="#ffe7ec">• relational structure</text><text x="80" y="180" font-family="monospace" font-size="13" fill="#ffe7ec">• joins and constraints</text><text x="80" y="198" font-family="monospace" font-size="13" fill="#ffe7ec">• transactions</text><rect x="474" y="92" width="252" height="148" rx="12" fill="#101723" stroke="#46b6ff"/><text x="492" y="120" font-family="monospace" font-size="18" fill="#98dcff">DOCUMENT</text><text x="492" y="144" font-family="monospace" font-size="13" fill="#e7f7ff">MongoDB</text><text x="492" y="162" font-family="monospace" font-size="13" fill="#e7f7ff">• flexible schema</text><text x="492" y="180" font-family="monospace" font-size="13" fill="#e7f7ff">• nested objects</text><text x="492" y="198" font-family="monospace" font-size="13" fill="#e7f7ff">• content-style data</text><rect x="886" y="92" width="252" height="148" rx="12" fill="#131118" stroke="#ff3150"/><text x="904" y="120" font-family="monospace" font-size="18" fill="#ff92a6">CACHE / REALTIME</text><text x="904" y="144" font-family="monospace" font-size="13" fill="#ffe7ec">Redis / Firebase / Supabase</text><text x="904" y="162" font-family="monospace" font-size="13" fill="#ffe7ec">• cache and sessions</text><text x="904" y="180" font-family="monospace" font-size="13" fill="#ffe7ec">• queue-like patterns</text><text x="904" y="198" font-family="monospace" font-size="13" fill="#ffe7ec">• managed realtime tools</text><path d="M314 163H474" fill="none" stroke="#46b6ff" stroke-width="3"/><path d="M726 163H886" fill="none" stroke="#ff3150" stroke-width="3"/><g fill="#fff"><circle r="6" stroke="#46b6ff" stroke-width="3"><animateMotion path="M314 163H1138" dur="5.8s" repeatCount="indefinite"/></circle></g><text x="70" y="284" font-family="monospace" font-size="14" fill="#caecff">Practical model: SQL stores core truth, Redis accelerates hot paths, document stores fit flexible data, managed platforms reduce setup time.</text></svg>