<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250">
  <rect width="1200" height="250" rx="16" fill="#080808" stroke="#5e0010" stroke-width="2"/>
  <style>
    .t { font-family: monospace; fill:#ff334d; }
    .dim { fill:#7e1e2d; }
  </style>

  <text class="t" x="55" y="42" font-size="18">MISSION 14 // BUILD RX-DEVELOPMENT</text>
  <text class="t" x="970" y="42" font-size="16">XP +999</text>

  <g font-family="monospace" font-size="16">
    <text x="55" y="196" class="dim">PROGRESS</text>
    <rect x="160" y="183" width="920" height="18" rx="9" fill="#240006"/>
    <rect x="160" y="183" width="1" height="18" rx="9" fill="#ff304a">
      <animate attributeName="width" values="1;65;130;195;260;325;390;455;520;585;650;715;780;845;920" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text class="t" x="55" y="228" font-size="15">[COLLECT LETTERS] [AVOID BUGS] [SHIP BUILD]</text>

  <g opacity=".12">
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#ff2e46"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#ff2e46"/>
  </g>

  <!-- SMIL text stages by swapping visible text groups -->
  <g text-anchor="middle" font-family="monospace" font-size="44" font-weight="700" fill="#ff334d">
    <text x="600" y="125" opacity="0">R_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.055;.056;1" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX_<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.055;.115;.116" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX-_<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.115;.175;.176" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX-D_<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.175;.235;.236" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX-DE_<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.235;.295;.296" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX-DEV_<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.295;.355;.356" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX-DEVE_<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.355;.415;.416" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX-DEVEL_<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.415;.475;.476" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX-DEVELO_<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.475;.535;.536" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX-DEVELOP_<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.535;.595;.596" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX-DEVELOPM_<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.595;.655;.656" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX-DEVELOPME_<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.655;.715;.716" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX-DEVELOPMEN_<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.715;.775;.776" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="125" opacity="0">RX-DEVELOPMENT<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.775;.96;1" dur="7s" repeatCount="indefinite"/></text>
  </g>

  <text x="600" y="160" text-anchor="middle" class="t" font-size="17" opacity="0">
    MISSION COMPLETE // BUILD SUCCESSFUL
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.8;.83;.96;1" dur="7s" repeatCount="indefinite"/>
  </text>

  <rect x="0" y="0" width="1200" height="4" fill="#ff334d" opacity=".8">
    <animate attributeName="y" values="0;246;0" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".12;.75;.12" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>