<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Animated multi-agent network</title>
  <desc id="desc">Research, planning, building, and verification agents exchange work through a central control core.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#4ad7ff" stop-opacity=".85"/><stop offset="1" stop-color="#9666ff" stop-opacity=".08"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1b2940" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="340" rx="24" fill="#080b12"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)" opacity=".5"/>
  <text x="48" y="50" fill="#ff436d" font-family="monospace" font-size="22" font-weight="700">MULTI-AGENT // LIVE NETWORK</text>
  <text x="1150" y="50" fill="#4ad7ff" font-family="monospace" font-size="15" text-anchor="end">PARALLEL + CONTROLLED</text>
  <g fill="none" stroke-width="3" stroke-dasharray="10 12" opacity=".9">
    <path d="M265 120C410 120 430 170 525 170" stroke="#4ad7ff"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2s" repeatCount="indefinite"/></path>
    <path d="M265 260C410 260 430 190 525 190" stroke="#9666ff"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M675 170C770 170 790 120 935 120" stroke="#ff436d"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.8s" repeatCount="indefinite"/></path>
    <path d="M675 190C770 190 790 260 935 260" stroke="#ffc45f"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.2s" repeatCount="indefinite"/></path>
  </g>
  <g font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">
    <g><rect x="90" y="82" width="175" height="76" rx="16" fill="#0d1420" stroke="#4ad7ff" stroke-width="2"/><circle cx="125" cy="120" r="8" fill="#4ad7ff"><animate attributeName="opacity" values=".25;1;.25" dur="1.7s" repeatCount="indefinite"/></circle><text x="180" y="126" fill="#dce8f5">RESEARCH</text></g>
    <g><rect x="90" y="222" width="175" height="76" rx="16" fill="#0d1420" stroke="#9666ff" stroke-width="2"/><circle cx="125" cy="260" r="8" fill="#9666ff"><animate attributeName="opacity" values=".25;1;.25" dur="2.1s" repeatCount="indefinite"/></circle><text x="180" y="266" fill="#dce8f5">PLAN</text></g>
    <g filter="url(#glow)"><circle cx="600" cy="180" r="78" fill="url(#core)" stroke="#4ad7ff" stroke-width="2"><animate attributeName="r" values="72;80;72" dur="3s" repeatCount="indefinite"/></circle><circle cx="600" cy="180" r="52" fill="#0d1420" stroke="#ff436d" stroke-width="2"/><text x="600" y="175" fill="#ffffff" font-size="24">RX CORE</text><text x="600" y="202" fill="#4ad7ff" font-size="13">ORCHESTRATE</text></g>
    <g><rect x="935" y="82" width="175" height="76" rx="16" fill="#0d1420" stroke="#ff436d" stroke-width="2"/><circle cx="970" cy="120" r="8" fill="#ff436d"><animate attributeName="opacity" values=".25;1;.25" dur="1.9s" repeatCount="indefinite"/></circle><text x="1025" y="126" fill="#dce8f5">BUILD</text></g>
    <g><rect x="935" y="222" width="175" height="76" rx="16" fill="#0d1420" stroke="#ffc45f" stroke-width="2"/><circle cx="970" cy="260" r="8" fill="#ffc45f"><animate attributeName="opacity" values=".25;1;.25" dur="2.3s" repeatCount="indefinite"/></circle><text x="1025" y="266" fill="#dce8f5">VERIFY</text></g>
  </g>
</svg>
