<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Animated tool execution pipeline</title>
  <desc id="desc">A task moves through code, test, build, deploy, and observe stages.</desc>
  <defs><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="300" rx="24" fill="#080b12"/>
  <text x="48" y="50" fill="#ff436d" font-family="monospace" font-size="22" font-weight="700">TOOL CALLS // EXECUTION STREAM</text>
  <path d="M100 165H1100" stroke="#27354c" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 165H1100" stroke="#4ad7ff" stroke-width="3" stroke-dasharray="18 28"><animate attributeName="stroke-dashoffset" from="0" to="-92" dur="2s" repeatCount="indefinite"/></path>
  <circle r="8" fill="#ffc45f" filter="url(#g)"><animateMotion dur="5s" repeatCount="indefinite" path="M100 165H1100"/></circle>
  <g font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">
    <g transform="translate(130 165)"><circle r="42" fill="#0d1420" stroke="#4ad7ff" stroke-width="2"/><text y="6" fill="#fff">PROMPT</text></g>
    <g transform="translate(365 165)"><circle r="42" fill="#0d1420" stroke="#9666ff" stroke-width="2"/><text y="6" fill="#fff">CODE</text></g>
    <g transform="translate(600 165)"><circle r="42" fill="#0d1420" stroke="#ff436d" stroke-width="2"/><text y="6" fill="#fff">TEST</text></g>
    <g transform="translate(835 165)"><circle r="42" fill="#0d1420" stroke="#4ad7ff" stroke-width="2"/><text y="6" fill="#fff">SHIP</text></g>
    <g transform="translate(1070 165)"><circle r="42" fill="#0d1420" stroke="#ffc45f" stroke-width="2"/><text y="6" fill="#fff">WATCH</text></g>
  </g>
  <text x="600" y="260" fill="#8fa1b8" font-family="monospace" font-size="14" text-anchor="middle">APIs · REPOSITORIES · TERMINALS · BROWSERS · DATABASES · CLOUD</text>
</svg>
