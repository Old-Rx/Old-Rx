<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><rect width="1200" height="450" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">SYSTEMS DOSSIER // PERFORMANCE &amp; LOW-LEVEL</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">DETAILS INSIDE THE SVG</text><rect x="48" y="66" width="310" height="126" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="64" y="93" font-family="monospace" font-size="18" fill="#9cdfff">MISSION</text><text x="64" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Cover the lower-level side of software where performance, memory, tooling, automation or system behavior matter directly.</text><rect x="378" y="66" width="364" height="126" rx="12" fill="#151017" stroke="#ff304f"/><text x="394" y="93" font-family="monospace" font-size="18" fill="#ff97a8">WHEN THIS AREA MATTERS</text><text x="394" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">Native apps, performance-heavy workloads, infrastructure tools, scripting, build systems and functional experimentation.</text><rect x="762" y="66" width="390" height="126" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="778" y="93" font-family="monospace" font-size="18" fill="#9cdfff">ENGINEERING VALUE</text><text x="778" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Understanding lower layers makes debugging, optimization and architectural trade-offs stronger across the full stack.</text><rect x="48" y="218" width="530" height="180" rx="12" fill="#151017" stroke="#ff304f"/><text x="64" y="245" font-family="monospace" font-size="18" fill="#ff97a8">LANGUAGE MAP</text><text x="64" y="267" font-family="monospace" font-size="13" fill="#ffe7ec">C / C++        : native software, engines, performance-sensitive work</text><text x="64" y="286" font-family="monospace" font-size="13" fill="#ffe7ec">Rust           : memory safety with systems-level control</text><text x="64" y="305" font-family="monospace" font-size="13" fill="#ffe7ec">Go             : simple, fast network and infra services</text><text x="64" y="324" font-family="monospace" font-size="13" fill="#ffe7ec">Bash / PowerShell : automation on Linux and Windows</text><text x="64" y="343" font-family="monospace" font-size="13" fill="#ffe7ec">Haskell        : functional composition and expressive modeling</text><rect x="620" y="218" width="532" height="180" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="636" y="245" font-family="monospace" font-size="18" fill="#9cdfff">PERFORMANCE CHECKLIST</text><text x="636" y="267" font-family="monospace" font-size="13" fill="#dff4ff">Measure before guessing.</text><text x="636" y="286" font-family="monospace" font-size="13" fill="#dff4ff">Watch CPU, memory, IO and concurrency.</text><text x="636" y="305" font-family="monospace" font-size="13" fill="#dff4ff">Reduce unnecessary allocations.</text><text x="636" y="324" font-family="monospace" font-size="13" fill="#dff4ff">Use the right tool for the cost profile.</text><text x="636" y="343" font-family="monospace" font-size="13" fill="#dff4ff">Optimize the proven bottleneck, not the imaginary one.</text><rect x="52" y="408" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="87.0" y="426" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">C</text><rect x="132" y="408" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="167.0" y="426" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">C++</text><rect x="212" y="408" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="247.0" y="426" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Rust</text><rect x="292" y="408" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="327.0" y="426" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Go</text><rect x="372" y="408" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="407.0" y="426" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Bash</text><rect x="452" y="408" width="100.60000000000001" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="502.3" y="426" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">PowerShell</text><rect x="562.6" y="408" width="76.42" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="600.8100000000001" y="426" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Haskell</text></svg>