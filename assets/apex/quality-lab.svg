  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="redBlue" x1="0" x2="1"><stop offset="0" stop-color="#ff304f"/><stop offset=".76" stop-color="#ff304f"/><stop offset="1" stop-color="#42b8ff"/></linearGradient>
</defs>
<rect width="1200" height="315" rx="18" fill="#05060a" stroke="#263247" stroke-width="2"/>
<text x="38" y="34" font-family="monospace" font-size="17" fill="#ff304f" text-anchor="start" font-weight="700">QUALITY LAB // TESTING &amp; DEBUGGING</text>
<text x="1160" y="34" font-family="monospace" font-size="13" fill="#9ddcff" text-anchor="end">EVIDENCE BEFORE GUESSING</text>
<rect x="58" y="86" width="252" height="150" rx="12" fill="#13090d" stroke="#ff304f" stroke-width="1.5"/><text x="76" y="114" font-family="monospace" font-size="17" fill="#ff9bad" text-anchor="start" font-weight="700">TEST</text><text x="76" y="138" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">unit tests</text><text x="76" y="157" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">integration tests</text><text x="76" y="176" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">edge cases</text><text x="76" y="195" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">regression checks</text><rect x="342" y="86" width="252" height="150" rx="12" fill="#0b121c" stroke="#42b8ff" stroke-width="1.5"/><text x="360" y="114" font-family="monospace" font-size="17" fill="#9ddcff" text-anchor="start" font-weight="700">REPRODUCE</text><text x="360" y="138" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">make failure repeatable</text><text x="360" y="157" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">capture inputs</text><text x="360" y="176" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">reduce variables</text><text x="360" y="195" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">keep exact logs</text><rect x="626" y="86" width="252" height="150" rx="12" fill="#13090d" stroke="#ff304f" stroke-width="1.5"/><text x="644" y="114" font-family="monospace" font-size="17" fill="#ff9bad" text-anchor="start" font-weight="700">DEBUG</text><text x="644" y="138" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">trace evidence</text><text x="644" y="157" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">inspect state</text><text x="644" y="176" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">find root cause</text><text x="644" y="195" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">patch smallest scope</text><rect x="910" y="86" width="232" height="150" rx="12" fill="#0b121c" stroke="#42b8ff" stroke-width="1.5"/><text x="928" y="114" font-family="monospace" font-size="17" fill="#9ddcff" text-anchor="start" font-weight="700">VERIFY</text><text x="928" y="138" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">rerun tests</text><text x="928" y="157" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">check behavior</text><text x="928" y="176" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">monitor release</text><text x="928" y="195" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">document cause</text><text x="58" y="278" font-family="monospace" font-size="14" fill="#cfeeff" text-anchor="start">Loop: reproduce → isolate → patch → verify → observe. Good debugging reduces uncertainty instead of adding guesses.</text></svg>