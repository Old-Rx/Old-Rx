<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">OBSERVABILITY DOSSIER // DELIVERY &amp; MONITORING</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">DETAILS INSIDE THE SVG</text><rect x="44" y="66" width="280" height="126" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="60" y="93" font-family="monospace" font-size="18" fill="#9cdfff">MISSION</text><text x="60" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Show what the running system is doing so failures can be understood instead of guessed at.</text><rect x="346" y="66" width="392" height="126" rx="12" fill="#151017" stroke="#ff304f"/><text x="362" y="93" font-family="monospace" font-size="18" fill="#ff97a8">DELIVERY LOOP</text><text x="362" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">Commit → test → build → deploy → route → observe → improve</text><rect x="760" y="66" width="396" height="126" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="776" y="93" font-family="monospace" font-size="18" fill="#9cdfff">WHY IT MATTERS</text><text x="776" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Without observation, production becomes a black box. Logs, metrics and dashboards keep the system explainable.</text><rect x="44" y="220" width="340" height="170" rx="12" fill="#151017" stroke="#ff304f"/><text x="60" y="247" font-family="monospace" font-size="18" fill="#ff97a8">LOGS</text><text x="60" y="269" font-family="monospace" font-size="13" fill="#ffe7ec">Useful for request details, exceptions, sequence of events and debugging the path that led to a failure.</text><rect x="406" y="220" width="340" height="170" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="422" y="247" font-family="monospace" font-size="18" fill="#9cdfff">METRICS</text><text x="422" y="269" font-family="monospace" font-size="13" fill="#dff4ff">Useful for trends over time: latency, error rate, CPU, memory, throughput and saturation.</text><rect x="768" y="220" width="388" height="170" rx="12" fill="#151017" stroke="#ff304f"/><text x="784" y="247" font-family="monospace" font-size="18" fill="#ff97a8">DASHBOARDS</text><text x="784" y="269" font-family="monospace" font-size="13" fill="#ffe7ec">Useful for compressing many system signals into one visible control surface for rapid diagnosis and monitoring.</text><rect x="48" y="426" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="83.0" y="444" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Commit</text><rect x="128" y="426" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="163.0" y="444" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Test</text><rect x="208" y="426" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="243.0" y="444" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Build</text><rect x="288" y="426" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="323.0" y="444" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Deploy</text><rect x="368" y="426" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="403.0" y="444" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Route</text><rect x="448" y="426" width="76.42" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="486.21" y="444" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Observe</text><rect x="534.42" y="426" width="76.42" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="572.63" y="444" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Improve</text></svg>