<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320"><rect width="1200" height="320" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">PRODUCTION BOSS // STABILIZE THE SYSTEM</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">PRODUCTION MODE</text><rect x="60" y="84" width="1080" height="34" rx="17" fill="#1c0d16"/><rect x="60" y="84" width="1080" height="34" rx="17" fill="#ff304f"><animate attributeName="width" values="1080;1010;1060;934;980;1080" dur="3.3s" repeatCount="indefinite"/></rect><rect x="60" y="84" width="1080" height="34" rx="17" fill="#42b8ff" opacity=".33"><animate attributeName="width" values="1080;998;1036;910;970;1080" dur="3.3s" repeatCount="indefinite"/></rect><text x="600" y="106" text-anchor="middle" font-family="monospace" font-size="15" fill="#fff">PRODUCTION HP</text><rect x="60" y="146" width="248" height="122" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="76" y="173" font-family="monospace" font-size="18" fill="#9cdfff">PHASE 1</text><text x="76" y="195" font-family="monospace" font-size="13" fill="#dff4ff">The local build works.</text><rect x="332" y="146" width="248" height="122" rx="12" fill="#151017" stroke="#ff304f"/><text x="348" y="173" font-family="monospace" font-size="18" fill="#ff97a8">PHASE 2</text><text x="348" y="195" font-family="monospace" font-size="13" fill="#ffe7ec">Production config differs from local assumptions.</text><rect x="604" y="146" width="248" height="122" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="620" y="173" font-family="monospace" font-size="18" fill="#9cdfff">PHASE 3</text><text x="620" y="195" font-family="monospace" font-size="13" fill="#dff4ff">Real traffic hits paths that were not simulated.</text><rect x="876" y="146" width="264" height="122" rx="12" fill="#151017" stroke="#ff304f"/><text x="892" y="173" font-family="monospace" font-size="18" fill="#ff97a8">PHASE 4 + 5</text><text x="892" y="195" font-family="monospace" font-size="13" fill="#ffe7ec">Logs expose edge cases. Patch, verify, observe and stabilize.</text><text x="60" y="300" font-family="monospace" font-size="14" fill="#ecf6ff">Victory condition: the system stays understandable while under failure pressure.</text></svg>