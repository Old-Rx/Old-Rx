<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">FRONTEND DOSSIER // UI, STATE &amp; RENDERING</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">DETAILS INSIDE THE SVG</text><rect x="48" y="66" width="270" height="122" rx="12" fill="#151017" stroke="#ff304f"/><text x="64" y="93" font-family="monospace" font-size="18" fill="#ff97a8">MISSION</text><text x="64" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">Transform user input, application state and fetched data into an interactive, readable, responsive interface.</text><rect x="340" y="66" width="370" height="122" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="356" y="93" font-family="monospace" font-size="18" fill="#9cdfff">KEY RESPONSIBILITIES</text><text x="356" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Pages and layouts</text><text x="356" y="134" font-family="monospace" font-size="13" fill="#dff4ff">Forms and validation feedback</text><text x="356" y="153" font-family="monospace" font-size="13" fill="#dff4ff">Components and state</text><text x="356" y="172" font-family="monospace" font-size="13" fill="#dff4ff">Browser fetching and rendering</text><rect x="732" y="66" width="420" height="122" rx="12" fill="#151017" stroke="#ff304f"/><text x="748" y="93" font-family="monospace" font-size="18" fill="#ff97a8">WHEN THIS LAYER IS GOOD</text><text x="748" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">The interface feels fast, predictable, accessible, consistent and easy to extend without turning into visual chaos.</text><rect x="48" y="214" width="526" height="156" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="64" y="241" font-family="monospace" font-size="18" fill="#9cdfff">PRIMARY STACK GROUPS</text><text x="64" y="263" font-family="monospace" font-size="13" fill="#dff4ff">Structure   : HTML</text><text x="64" y="282" font-family="monospace" font-size="13" fill="#dff4ff">Styling     : CSS, Sass, Tailwind, Bootstrap, Material UI</text><text x="64" y="301" font-family="monospace" font-size="13" fill="#dff4ff">Logic       : JavaScript, TypeScript</text><text x="64" y="320" font-family="monospace" font-size="13" fill="#dff4ff">Frameworks  : React, Vue, Angular, Svelte</text><text x="64" y="339" font-family="monospace" font-size="13" fill="#dff4ff">Meta-frames : Next.js, Nuxt</text><text x="64" y="358" font-family="monospace" font-size="13" fill="#dff4ff">State/Build : Redux, Vite, Webpack</text><rect x="604" y="214" width="548" height="156" rx="12" fill="#151017" stroke="#ff304f"/><text x="620" y="241" font-family="monospace" font-size="18" fill="#ff97a8">FLOW MODEL</text><text x="620" y="263" font-family="monospace" font-size="13" fill="#ffe7ec">Input → component event → state update → API request or local compute → conditional render → DOM / paint → user sees the result.</text><rect x="52" y="392" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="87.0" y="410" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">HTML</text><rect x="132" y="392" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="167.0" y="410" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">CSS</text><rect x="212" y="392" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="247.0" y="410" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Sass</text><rect x="292" y="392" width="100.60000000000001" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="342.3" y="410" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">JavaScript</text><rect x="402.6" y="392" width="100.60000000000001" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="452.90000000000003" y="410" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">TypeScript</text><rect x="52" y="430" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="87.0" y="448" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">React</text><rect x="132" y="430" width="76.42" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="170.21" y="448" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Next.js</text><rect x="218.42000000000002" y="430" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="253.42000000000002" y="448" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Vue</text><rect x="298.42" y="430" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="333.42" y="448" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Nuxt</text><rect x="378.42" y="430" width="76.42" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="416.63" y="448" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Angular</text><rect x="464.84000000000003" y="430" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="499.84000000000003" y="448" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Svelte</text><rect x="52" y="468" width="84.48" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="94.24000000000001" y="486" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Tailwind</text><rect x="146.48000000000002" y="468" width="92.54" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="192.75000000000003" y="486" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Bootstrap</text><rect x="249.02000000000004" y="468" width="108.66000000000001" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="303.35" y="486" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Material UI</text><rect x="367.68000000000006" y="468" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="402.68000000000006" y="486" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Redux</text><rect x="447.68000000000006" y="468" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="482.68000000000006" y="486" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Vite</text><rect x="527.6800000000001" y="468" width="76.42" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="565.8900000000001" y="486" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Webpack</text><rect x="614.1" y="468" width="84.48" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="656.34" y="486" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Three.js</text><circle r="6" stroke="#fff" stroke-width="2" fill="#42b8ff"><animateMotion path="M48 196H1152" dur="6.4s" repeatCount="indefinite"/></circle></svg>