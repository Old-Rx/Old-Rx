<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"><rect width="1200" height="380" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">MISSION BOARD // PROFILE ROADMAP</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">DIRECTION</text><rect x="44" y="66" width="536" height="264" rx="12" fill="#151017" stroke="#ff304f"/><text x="60" y="93" font-family="monospace" font-size="18" fill="#ff97a8">CURRENT DIRECTION</text><text x="60" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">[████████████████████████████████████████] Old-Rx identity system</text><text x="60" y="134" font-family="monospace" font-size="13" fill="#ffe7ec">[████████████████████████████████████████] RX-Development dossier package</text><text x="60" y="153" font-family="monospace" font-size="13" fill="#ffe7ec">[███████████████████████████████████░░░░░] Put more detail directly into SVG panels</text><text x="60" y="172" font-family="monospace" font-size="13" fill="#ffe7ec">[██████████████████████████████░░░░░░░░░░] Expand project showcase over time</text><text x="60" y="191" font-family="monospace" font-size="13" fill="#ffe7ec">[████████████████████████░░░░░░░░░░░░░░░░] Grow public repository network</text><rect x="610" y="66" width="546" height="264" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="626" y="93" font-family="monospace" font-size="18" fill="#9cdfff">PROFILE RULES</text><text x="626" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Keep red dominant and blue secondary.</text><text x="626" y="134" font-family="monospace" font-size="13" fill="#dff4ff">Prefer local, self-contained SVG assets.</text><text x="626" y="153" font-family="monospace" font-size="13" fill="#dff4ff">Group technologies by purpose, not random icon dumps.</text><text x="626" y="172" font-family="monospace" font-size="13" fill="#dff4ff">Anchor the profile in real repositories.</text><text x="626" y="191" font-family="monospace" font-size="13" fill="#dff4ff">Use animation carefully so the visuals stay readable.</text></svg>