<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">MOBILE + CLOUD DOSSIER // CLIENTS &amp; RUNTIME</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">DETAILS INSIDE THE SVG</text><rect x="46" y="66" width="308" height="120" rx="12" fill="#151017" stroke="#ff304f"/><text x="62" y="93" font-family="monospace" font-size="18" fill="#ff97a8">MOBILE MISSION</text><text x="62" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">Deliver application experiences to users on phones and tablets with native or cross-platform stacks.</text><rect x="374" y="66" width="780" height="120" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="390" y="93" font-family="monospace" font-size="18" fill="#9cdfff">CLOUD MISSION</text><text x="390" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Provide the runtime environment: hosting, storage, networking, scaling, edge delivery, security and easy deployment targets.</text><rect x="46" y="212" width="304" height="186" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="62" y="239" font-family="monospace" font-size="18" fill="#9cdfff">MOBILE STACK</text><text x="62" y="261" font-family="monospace" font-size="13" fill="#dff4ff">Flutter / Dart : cross-platform UI</text><text x="62" y="280" font-family="monospace" font-size="13" fill="#dff4ff">Kotlin         : Android / JVM clients</text><text x="62" y="299" font-family="monospace" font-size="13" fill="#dff4ff">Swift          : Apple platform apps</text><text x="62" y="318" font-family="monospace" font-size="13" fill="#dff4ff">React patterns : component-driven client logic</text><rect x="374" y="212" width="376" height="186" rx="12" fill="#151017" stroke="#ff304f"/><text x="390" y="239" font-family="monospace" font-size="18" fill="#ff97a8">CLOUD STACK</text><text x="390" y="261" font-family="monospace" font-size="13" fill="#ffe7ec">AWS, Azure, GCP</text><text x="390" y="280" font-family="monospace" font-size="13" fill="#ffe7ec">Cloudflare</text><text x="390" y="299" font-family="monospace" font-size="13" fill="#ffe7ec">Vercel, Netlify</text><text x="390" y="318" font-family="monospace" font-size="13" fill="#ffe7ec">These platforms differ in scale, managed services, edge networks and developer workflow.</text><rect x="774" y="212" width="380" height="186" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="790" y="239" font-family="monospace" font-size="18" fill="#9cdfff">HOW THEY CONNECT</text><text x="790" y="261" font-family="monospace" font-size="13" fill="#dff4ff">Mobile and web clients are the experience surface. Cloud platforms host APIs, data, CDN edges and deployment flow behind that surface.</text><rect x="50" y="428" width="76.42" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="88.21000000000001" y="446" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Flutter</text><rect x="136.42000000000002" y="428" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="171.42000000000002" y="446" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Dart</text><rect x="216.42000000000002" y="428" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="251.42000000000002" y="446" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Kotlin</text><rect x="296.42" y="428" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="331.42" y="446" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Swift</text><rect x="420" y="428" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="455.0" y="446" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">AWS</text><rect x="500" y="428" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="535.0" y="446" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Azure</text><rect x="580" y="428" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="615.0" y="446" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">GCP</text><rect x="660" y="428" width="100.60000000000001" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="710.3" y="446" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Cloudflare</text><rect x="770.6" y="428" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="805.6" y="446" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Vercel</text><rect x="850.6" y="428" width="76.42" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="888.8100000000001" y="446" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Netlify</text></svg>