<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">TOOLING DOSSIER // DEVELOPMENT WORKBENCH</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">DETAILS INSIDE THE SVG</text><rect x="44" y="66" width="296" height="146" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="60" y="93" font-family="monospace" font-size="18" fill="#9cdfff">WHY TOOLING MATTERS</text><text x="60" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Better tooling shortens feedback loops, reduces friction and makes experimentation, testing and collaboration easier.</text><rect x="362" y="66" width="350" height="146" rx="12" fill="#151017" stroke="#ff304f"/><text x="378" y="93" font-family="monospace" font-size="18" fill="#ff97a8">VERSION CONTROL &amp; CODE</text><text x="378" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">Git, GitHub, GitLab</text><text x="378" y="134" font-family="monospace" font-size="13" fill="#ffe7ec">VS Code, Visual Studio</text><text x="378" y="153" font-family="monospace" font-size="13" fill="#ffe7ec">IntelliJ, PhpStorm, PyCharm</text><rect x="734" y="66" width="422" height="146" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="750" y="93" font-family="monospace" font-size="18" fill="#9cdfff">OTHER SUPPORT TOOLS</text><text x="750" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Postman for API testing</text><text x="750" y="134" font-family="monospace" font-size="13" fill="#dff4ff">Figma for design and handoff</text><text x="750" y="153" font-family="monospace" font-size="13" fill="#dff4ff">npm, Yarn, pnpm, Bun</text><text x="750" y="172" font-family="monospace" font-size="13" fill="#dff4ff">Maven, Gradle, CMake</text><rect x="44" y="238" width="1112" height="126" rx="12" fill="#151017" stroke="#ff304f"/><text x="60" y="265" font-family="monospace" font-size="18" fill="#ff97a8">TOOLING PRINCIPLE</text><text x="60" y="287" font-family="monospace" font-size="13" fill="#ffe7ec">A good toolchain does not replace engineering skill, but it dramatically improves speed, consistency and the quality of the feedback you get while building.</text><rect x="48" y="382" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="83.0" y="400" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffdbe2">Git</text><rect x="126" y="382" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="161.0" y="400" text-anchor="middle" font-family="monospace" font-size="12" fill="#dff4ff">GitHub</text><rect x="204" y="382" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="239.0" y="400" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffdbe2">GitLab</text><rect x="282" y="382" width="72.08" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="318.04" y="400" text-anchor="middle" font-family="monospace" font-size="12" fill="#dff4ff">VS Code</text><rect x="362.08" y="382" width="116.72" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="420.44" y="400" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffdbe2">Visual Studio</text><rect x="486.79999999999995" y="382" width="79.52" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="526.56" y="400" text-anchor="middle" font-family="monospace" font-size="12" fill="#dff4ff">IntelliJ</text><rect x="574.3199999999999" y="382" width="79.52" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="614.0799999999999" y="400" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffdbe2">PhpStorm</text><rect x="661.8399999999999" y="382" width="72.08" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="697.8799999999999" y="400" text-anchor="middle" font-family="monospace" font-size="12" fill="#dff4ff">PyCharm</text></svg>