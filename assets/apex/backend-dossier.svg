<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">BACKEND DOSSIER // API &amp; BUSINESS LOGIC</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">DETAILS INSIDE THE SVG</text><rect x="42" y="66" width="286" height="122" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="58" y="93" font-family="monospace" font-size="18" fill="#9cdfff">MISSION</text><text x="58" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Protect requests, validate data, apply business rules, integrate services and return reliable responses.</text><rect x="348" y="66" width="346" height="122" rx="12" fill="#151017" stroke="#ff304f"/><text x="364" y="93" font-family="monospace" font-size="18" fill="#ff97a8">REQUEST PIPELINE</text><text x="364" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">Route → auth → permission → validation → logic → data access → response</text><rect x="714" y="66" width="444" height="122" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="730" y="93" font-family="monospace" font-size="18" fill="#9cdfff">WHEN THIS LAYER IS GOOD</text><text x="730" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Requests are predictable, errors are understandable, contracts stay stable and internal complexity is kept behind clean interfaces.</text><rect x="42" y="214" width="352" height="170" rx="12" fill="#151017" stroke="#ff304f"/><text x="58" y="241" font-family="monospace" font-size="18" fill="#ff97a8">STACK GROUPS</text><text x="58" y="263" font-family="monospace" font-size="13" fill="#ffe7ec">JavaScript / TypeScript : Node.js, Express, NestJS</text><text x="58" y="282" font-family="monospace" font-size="13" fill="#ffe7ec">PHP                   : Laravel, Symfony</text><text x="58" y="301" font-family="monospace" font-size="13" fill="#ffe7ec">Python                : Django, Flask, FastAPI</text><text x="58" y="320" font-family="monospace" font-size="13" fill="#ffe7ec">Java                  : Spring</text><text x="58" y="339" font-family="monospace" font-size="13" fill="#ffe7ec">C#                    : .NET</text><text x="58" y="358" font-family="monospace" font-size="13" fill="#ffe7ec">Other                 : Go, Rust, Ruby on Rails</text><rect x="418" y="214" width="352" height="170" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="434" y="241" font-family="monospace" font-size="18" fill="#9cdfff">COMMON RESPONSIBILITIES</text><text x="434" y="263" font-family="monospace" font-size="13" fill="#dff4ff">Authentication and sessions</text><text x="434" y="282" font-family="monospace" font-size="13" fill="#dff4ff">Authorization and permissions</text><text x="434" y="301" font-family="monospace" font-size="13" fill="#dff4ff">Input validation and sanitization</text><text x="434" y="320" font-family="monospace" font-size="13" fill="#dff4ff">Business logic and orchestration</text><text x="434" y="339" font-family="monospace" font-size="13" fill="#dff4ff">Integrations, jobs, queues and APIs</text><rect x="794" y="214" width="364" height="170" rx="12" fill="#151017" stroke="#ff304f"/><text x="810" y="241" font-family="monospace" font-size="18" fill="#ff97a8">ENGINEERING PRINCIPLE</text><text x="810" y="263" font-family="monospace" font-size="13" fill="#ffe7ec">A backend should expose clean contracts outward and keep the dangerous complexity inward, tested and observable.</text><rect x="48" y="414" width="76.42" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="86.21000000000001" y="432" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Node.js</text><rect x="134.42000000000002" y="414" width="76.42" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="172.63000000000002" y="432" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Express</text><rect x="220.84000000000003" y="414" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="255.84000000000003" y="432" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">NestJS</text><rect x="300.84000000000003" y="414" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="335.84000000000003" y="432" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">PHP</text><rect x="380.84000000000003" y="414" width="76.42" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="419.05" y="432" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Laravel</text><rect x="467.26000000000005" y="414" width="76.42" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="505.47" y="432" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Symfony</text><rect x="48" y="452" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="83.0" y="470" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Python</text><rect x="128" y="452" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="163.0" y="470" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Django</text><rect x="208" y="452" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="243.0" y="470" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Flask</text><rect x="288" y="452" width="76.42" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="326.21" y="470" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">FastAPI</text><rect x="374.42" y="452" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="409.42" y="470" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Java</text><rect x="454.42" y="452" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="489.42" y="470" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Spring</text><rect x="48" y="490" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="83.0" y="508" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">C#</text><rect x="128" y="490" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="163.0" y="508" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">.NET</text><rect x="208" y="490" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="243.0" y="508" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Go</text><rect x="288" y="490" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="323.0" y="508" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Rust</text><rect x="368" y="490" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="403.0" y="508" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Ruby</text><rect x="448" y="490" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="483.0" y="508" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Rails</text><rect x="528" y="490" width="76.42" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="566.21" y="508" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">GraphQL</text></svg>