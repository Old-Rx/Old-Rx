<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">ENGINEERING CORE // SECURITY, TESTING &amp; DEBUGGING</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">DETAILS INSIDE THE SVG</text><rect x="44" y="66" width="356" height="134" rx="12" fill="#151017" stroke="#ff304f"/><text x="60" y="93" font-family="monospace" font-size="18" fill="#ff97a8">SECURITY INSIDE THE SYSTEM</text><text x="60" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">Validation, authentication, authorization, safe defaults, secret handling and logging should be designed into the request path.</text><rect x="422" y="66" width="356" height="134" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="438" y="93" font-family="monospace" font-size="18" fill="#9cdfff">QUALITY MINDSET</text><text x="438" y="115" font-family="monospace" font-size="13" fill="#dff4ff">A strong system is not just feature-complete. It is testable, inspectable, reproducible and understandable under failure.</text><rect x="800" y="66" width="356" height="134" rx="12" fill="#151017" stroke="#ff304f"/><text x="816" y="93" font-family="monospace" font-size="18" fill="#ff97a8">DEBUGGING MINDSET</text><text x="816" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">Reproduce the issue, reduce variables, collect logs, isolate the smallest cause, patch safely and verify the behavior again.</text><rect x="44" y="226" width="356" height="202" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="60" y="253" font-family="monospace" font-size="18" fill="#9cdfff">SECURITY CHECKLIST</text><text x="60" y="275" font-family="monospace" font-size="13" fill="#dff4ff">1. Validate input</text><text x="60" y="294" font-family="monospace" font-size="13" fill="#dff4ff">2. Authenticate the actor</text><text x="60" y="313" font-family="monospace" font-size="13" fill="#dff4ff">3. Authorize permissions</text><text x="60" y="332" font-family="monospace" font-size="13" fill="#dff4ff">4. Keep secrets out of code</text><text x="60" y="351" font-family="monospace" font-size="13" fill="#dff4ff">5. Deny by default</text><text x="60" y="370" font-family="monospace" font-size="13" fill="#dff4ff">6. Observe suspicious behavior</text><rect x="422" y="226" width="356" height="202" rx="12" fill="#151017" stroke="#ff304f"/><text x="438" y="253" font-family="monospace" font-size="18" fill="#ff97a8">TESTING CHECKLIST</text><text x="438" y="275" font-family="monospace" font-size="13" fill="#ffe7ec">1. Unit checks for logic</text><text x="438" y="294" font-family="monospace" font-size="13" fill="#ffe7ec">2. Integration checks for boundaries</text><text x="438" y="313" font-family="monospace" font-size="13" fill="#ffe7ec">3. Regression checks for old failures</text><text x="438" y="332" font-family="monospace" font-size="13" fill="#ffe7ec">4. Manual verification for critical flows</text><text x="438" y="351" font-family="monospace" font-size="13" fill="#ffe7ec">5. Monitoring after deployment</text><rect x="800" y="226" width="356" height="202" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="816" y="253" font-family="monospace" font-size="18" fill="#9cdfff">DEBUG CHECKLIST</text><text x="816" y="275" font-family="monospace" font-size="13" fill="#dff4ff">1. Capture the failing case</text><text x="816" y="294" font-family="monospace" font-size="13" fill="#dff4ff">2. Find the smallest reproducer</text><text x="816" y="313" font-family="monospace" font-size="13" fill="#dff4ff">3. Prove the root cause</text><text x="816" y="332" font-family="monospace" font-size="13" fill="#dff4ff">4. Change the smallest safe scope</text><text x="816" y="351" font-family="monospace" font-size="13" fill="#dff4ff">5. Observe production after the patch</text><text x="44" y="490" font-family="monospace" font-size="14" fill="#ecf6ff">Principle: build with evidence, not guesses. Production truth beats assumption.</text></svg>