<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">TECH UNIVERSE // RESPONSIBILITY MAP</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">ROLE-FIRST ARCHITECTURE</text><g transform="translate(600 238)"><circle r="60" fill="#15131a" stroke="#fff" stroke-opacity=".25"/><circle r="46" fill="#1b0f17" stroke="#ff304f" stroke-width="4"/><text y="2" text-anchor="middle" font-family="monospace" font-size="20" fill="#fff">RX</text><text y="24" text-anchor="middle" font-family="monospace" font-size="13" fill="#92ddff">CORE</text><g fill="none" opacity=".55"><ellipse rx="254" ry="92" stroke="#42b8ff"/><ellipse rx="188" ry="150" stroke="#ff304f"/><ellipse rx="120" ry="205" stroke="#89d8ff"/></g><circle r="6" stroke="#fff" stroke-width="2" fill="#42b8ff"><animateMotion path="M0 -205 A120 205 0 1 1 1 -205" dur="10s" repeatCount="indefinite"/></circle><circle r="6" stroke="#fff" stroke-width="2" fill="#ff304f"><animateMotion path="M254 0 A254 92 0 1 1 -254 0 A254 92 0 1 1 254 0" dur="7.5s" repeatCount="indefinite"/></circle></g><rect x="517" y="20" width="220" height="62" rx="12" fill="#151017" stroke="#ff304f"/><text x="533" y="47" font-family="monospace" font-size="16" fill="#ff97a8">FRONTEND</text><text x="533" y="69" font-family="monospace" font-size="11" fill="#ffe7ec">Turns state and events into visible UI.</text><rect x="930" y="172" width="220" height="62" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="946" y="199" font-family="monospace" font-size="16" fill="#9cdfff">BACKEND</text><text x="946" y="221" font-family="monospace" font-size="11" fill="#dff4ff">Owns APIs, auth, logic and service behavior.</text><rect x="78" y="172" width="220" height="62" rx="12" fill="#151017" stroke="#ff304f"/><text x="94" y="199" font-family="monospace" font-size="16" fill="#ff97a8">DATABASES</text><text x="94" y="221" font-family="monospace" font-size="11" fill="#ffe7ec">Stores truth and accelerates critical paths.</text><rect x="517" y="394" width="220" height="62" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="533" y="421" font-family="monospace" font-size="16" fill="#9cdfff">DEVOPS</text><text x="533" y="443" font-family="monospace" font-size="11" fill="#dff4ff">Builds, deploys, routes and observes.</text><rect x="92" y="44" width="220" height="62" rx="12" fill="#151017" stroke="#ff304f"/><text x="108" y="71" font-family="monospace" font-size="16" fill="#ff97a8">SYSTEMS</text><text x="108" y="93" font-family="monospace" font-size="11" fill="#ffe7ec">Covers performance, tooling and low-level control.</text><rect x="888" y="44" width="220" height="62" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="904" y="71" font-family="monospace" font-size="16" fill="#9cdfff">CLOUD</text><text x="904" y="93" font-family="monospace" font-size="11" fill="#dff4ff">Hosts, scales and protects application runtimes.</text><rect x="92" y="342" width="220" height="62" rx="12" fill="#151017" stroke="#ff304f"/><text x="108" y="369" font-family="monospace" font-size="16" fill="#ff97a8">MOBILE</text><text x="108" y="391" font-family="monospace" font-size="11" fill="#ffe7ec">Delivers client apps across device platforms.</text><rect x="888" y="342" width="220" height="62" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="904" y="369" font-family="monospace" font-size="16" fill="#9cdfff">TOOLING</text><text x="904" y="391" font-family="monospace" font-size="11" fill="#dff4ff">Supports editing, testing, packaging and workflow.</text><text x="60" y="452" font-family="monospace" font-size="14" fill="#ecf6ff">Principle: a stack is strongest when each layer clearly owns a different problem.</text></svg>