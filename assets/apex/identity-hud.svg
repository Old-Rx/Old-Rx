<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><rect width="1200" height="430" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">IDENTITY HUD // PROFILE DOSSIER</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">CORE PROFILE INFO</text><rect x="52" y="70" width="340" height="138" rx="12" fill="#151017" stroke="#ff304f"/><text x="68" y="97" font-family="monospace" font-size="18" fill="#ff97a8">PLAYER DATA</text><text x="68" y="119" font-family="monospace" font-size="13" fill="#ffe7ec">Name      : Old-Rx</text><text x="68" y="138" font-family="monospace" font-size="13" fill="#ffe7ec">Codename  : RX-Development</text><text x="68" y="157" font-family="monospace" font-size="13" fill="#ffe7ec">Theme     : red dominant with blue signal accents</text><text x="68" y="176" font-family="monospace" font-size="13" fill="#ffe7ec">Model     : self-contained SVG-first profile</text><rect x="430" y="70" width="340" height="138" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="446" y="97" font-family="monospace" font-size="18" fill="#9cdfff">DESIGN GOAL</text><text x="446" y="119" font-family="monospace" font-size="13" fill="#dff4ff">Turn the GitHub profile into a cinematic developer dashboard,</text><text x="446" y="138" font-family="monospace" font-size="13" fill="#dff4ff">not just a plain text résumé. Keep it technical, animated,</text><text x="446" y="157" font-family="monospace" font-size="13" fill="#dff4ff">organized and immediately recognizable.</text><rect x="808" y="70" width="340" height="138" rx="12" fill="#151017" stroke="#ff304f"/><text x="824" y="97" font-family="monospace" font-size="18" fill="#ff97a8">BUILD RULES</text><text x="824" y="119" font-family="monospace" font-size="13" fill="#ffe7ec">1. Stable SVG structure</text><text x="824" y="138" font-family="monospace" font-size="13" fill="#ffe7ec">2. Red as primary energy</text><text x="824" y="157" font-family="monospace" font-size="13" fill="#ffe7ec">3. Blue only as support light</text><text x="824" y="176" font-family="monospace" font-size="13" fill="#ffe7ec">4. Real repo signal over fake hype</text><rect x="52" y="236" width="522" height="146" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="68" y="263" font-family="monospace" font-size="18" fill="#9cdfff">ENGINEERING LOOP</text><text x="68" y="285" font-family="monospace" font-size="13" fill="#dff4ff">Understand the problem → design the shape → build the solution → test behavior → debug with evidence → deploy safely → observe production → improve the next iteration.</text><rect x="626" y="236" width="522" height="146" rx="12" fill="#151017" stroke="#ff304f"/><text x="642" y="263" font-family="monospace" font-size="18" fill="#ff97a8">PROFILE STRATEGY</text><text x="642" y="285" font-family="monospace" font-size="13" fill="#ffe7ec">Move the detailed explanations into SVG cards themselves so the README can stay cleaner while each visual panel carries its own meaning and context.</text></svg>