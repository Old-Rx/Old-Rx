" text-anchor="start">temporary state</text><text x="830" y="197" font-family="monospace" font-size="13" fill="#f7f8fb" text-anchor="start">managed realtime</text><path d="M388 168H435" fill="none" stroke="#42b8ff" stroke-width="3"/><path d="M765 168H812" fill="none" stroke="#ff304f" stroke-width="3"/><circle r="6" fill="#fff" stroke="#42b8ff" stroke-width="3"><animateMotion path="M388 168H1142" dur="5.6s" repeatCount="indefinite"/></circle><text x="58" y="292" font-family="monospace" font-size="14" fill="#cfeeff" text-anchor="start">Model: relational DB = source of truth • Redis = speed • document DB = flexible shapes • managed platform = faster setup</text></svg>