<text x="1160" y="34" font-family="monospace" font-size="13" fill="#9ddcff" text-anchor="end">SAFE BY DESIGN</text>
<g transform="translate(190 176)"><path d="M0-82 L60-57 V-8 C60 46 23 82 0 96 C-23 82 -60 46 -60 -8 V-57 Z" fill="#101722" stroke="#42b8ff" stroke-width="4"/><path d="M0-58 L29-44 V-12 C29 19 10 40 0 49 C-10 40 -29 19 -29 -12 V-44 Z" fill="#ff304f" opacity=".24"/><animateTransform attributeName="transform" type="scale" values="1;1.035;1" dur="2s" repeatCount="indefinite"/></g><text x="355" y="82" font-family="monospace" font-size="15" fill="#ff9bad" text-anchor="start" font-weight="700">VALIDATION</text><text x="555" y="82" font-family="monospace" font-size="15" fill="#f7f8fb" text-anchor="start">reject malformed input</text><text x="355" y="119" font-family="monospace" font-size="15" fill="#9ddcff" text-anchor="start" font-weight="700">AUTHENTICATION</text><text x="555" y="119" font-family="monospace" font-size="15" fill="#f7f8fb" text-anchor="start">identify the actor</text><text x="355" y="156" font-family="monospace" font-size="15" fill="#ff9bad" text-anchor="start" font-weight="700">AUTHORIZATION</text><text x="555" y="156" font-family="monospace" font-size="15" fill="#f7f8fb" text-anchor="start">verify permissions</text><text x="355" y="193" font-family="monospace" font-size="15" fill="#9ddcff" text-anchor="start" font-weight="700">SECRETS</text><text x="555" y="193" font-family="monospace" font-size="15" fill="#f7f8fb" text-anchor="start">keep credentials out of code</text><text x="355" y="230" font-family="monospace" font-size="15" fill="#ff9bad" text-anchor="start" font-weight="700">SAFE DEFAULTS</text><text x="555" y="230" font-family="monospace" font-size="15" fill="#f7f8fb" text-anchor="start">deny by default</text><text x="355" y="267" font-family="monospace" font-size="15" fill="#9ddcff" text-anchor="start" font-weight="700">LOGGING</text><text x="555" y="267" font-family="monospace" font-size="15" fill="#f7f8fb" text-anchor="start">observe suspicious behavior</text><text x="355" y="295" font-family="monospace" font-size="14" fill="#cfeeff" text-anchor="start">Security is not a final checklist; it is part of routing, data access, deployment and monitoring.</text></svg>