<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">DEVOPS DOSSIER // BUILD, SHIP &amp; OBSERVE</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">DETAILS INSIDE THE SVG</text><rect x="44" y="66" width="266" height="126" rx="12" fill="#151017" stroke="#ff304f"/><text x="60" y="93" font-family="monospace" font-size="18" fill="#ff97a8">MISSION</text><text x="60" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">Make the path from code to production visible, repeatable, safe and observable.</text><rect x="332" y="66" width="410" height="126" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="348" y="93" font-family="monospace" font-size="18" fill="#9cdfff">DELIVERY LOOP</text><text x="348" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Commit → test → build → package → deploy → route → monitor → improve</text><rect x="764" y="66" width="392" height="126" rx="12" fill="#151017" stroke="#ff304f"/><text x="780" y="93" font-family="monospace" font-size="18" fill="#ff97a8">WHEN THIS LAYER IS GOOD</text><text x="780" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">Releases are boring in the best way: predictable, fast to diagnose and easy to rollback or fix.</text><rect x="44" y="218" width="352" height="170" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="60" y="245" font-family="monospace" font-size="18" fill="#9cdfff">TOOLS &amp; PLATFORMS</text><text x="60" y="267" font-family="monospace" font-size="13" fill="#dff4ff">Linux / Ubuntu / Debian</text><text x="60" y="286" font-family="monospace" font-size="13" fill="#dff4ff">Docker / Kubernetes</text><text x="60" y="305" font-family="monospace" font-size="13" fill="#dff4ff">NGINX</text><text x="60" y="324" font-family="monospace" font-size="13" fill="#dff4ff">GitHub Actions / Jenkins</text><text x="60" y="343" font-family="monospace" font-size="13" fill="#dff4ff">Terraform / Ansible</text><text x="60" y="362" font-family="monospace" font-size="13" fill="#dff4ff">Prometheus / Grafana</text><rect x="424" y="218" width="332" height="170" rx="12" fill="#151017" stroke="#ff304f"/><text x="440" y="245" font-family="monospace" font-size="18" fill="#ff97a8">PRACTICAL GOALS</text><text x="440" y="267" font-family="monospace" font-size="13" fill="#ffe7ec">Automate repetition</text><text x="440" y="286" font-family="monospace" font-size="13" fill="#ffe7ec">Reduce environment drift</text><text x="440" y="305" font-family="monospace" font-size="13" fill="#ffe7ec">Keep deployments traceable</text><text x="440" y="324" font-family="monospace" font-size="13" fill="#ffe7ec">Watch runtime health</text><text x="440" y="343" font-family="monospace" font-size="13" fill="#ffe7ec">Preserve recovery paths</text><rect x="784" y="218" width="372" height="170" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="800" y="245" font-family="monospace" font-size="18" fill="#9cdfff">OBSERVABILITY</text><text x="800" y="267" font-family="monospace" font-size="13" fill="#dff4ff">Logs tell you what happened.</text><text x="800" y="286" font-family="monospace" font-size="13" fill="#dff4ff">Metrics tell you how the system behaves over time.</text><text x="800" y="305" font-family="monospace" font-size="13" fill="#dff4ff">Dashboards compress large system state into readable signals.</text><rect x="48" y="420" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="83.0" y="438" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Linux</text><rect x="128" y="420" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="163.0" y="438" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Docker</text><rect x="208" y="420" width="100.60000000000001" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="258.3" y="438" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Kubernetes</text><rect x="318.6" y="420" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="353.6" y="438" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">NGINX</text><rect x="398.6" y="420" width="132.84" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="465.02000000000004" y="438" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">GitHub Actions</text><rect x="541.44" y="420" width="76.42" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="579.6500000000001" y="438" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Jenkins</text><rect x="48" y="458" width="92.54" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="94.27000000000001" y="476" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Terraform</text><rect x="150.54000000000002" y="458" width="76.42" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="188.75000000000003" y="476" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Ansible</text><rect x="236.96000000000004" y="458" width="100.60000000000001" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="287.26000000000005" y="476" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Prometheus</text><rect x="347.56000000000006" y="458" width="76.42" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="385.77000000000004" y="476" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Grafana</text></svg>