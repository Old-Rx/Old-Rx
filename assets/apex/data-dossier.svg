<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="18" fill="#05060a" stroke="#35425c"/><text x="42" y="38" font-family="monospace" font-size="18" fill="#ff304f">DATA DOSSIER // DATABASES, CACHE &amp; REALTIME</text><text x="1140" y="38" text-anchor="end" font-family="monospace" font-size="13" fill="#92ddff">DETAILS INSIDE THE SVG</text><rect x="46" y="66" width="300" height="120" rx="12" fill="#151017" stroke="#ff304f"/><text x="62" y="93" font-family="monospace" font-size="18" fill="#ff97a8">MISSION</text><text x="62" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">Persist durable truth, support transactions, enable flexible records and accelerate hot paths with cache or managed services.</text><rect x="366" y="66" width="378" height="120" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="382" y="93" font-family="monospace" font-size="18" fill="#9cdfff">HOW TO THINK ABOUT DATA</text><text x="382" y="115" font-family="monospace" font-size="13" fill="#dff4ff">Use the right storage model for the right shape of problem, not one database for every situation.</text><rect x="766" y="66" width="388" height="120" rx="12" fill="#151017" stroke="#ff304f"/><text x="782" y="93" font-family="monospace" font-size="18" fill="#ff97a8">GOOD DATA LAYER</text><text x="782" y="115" font-family="monospace" font-size="13" fill="#ffe7ec">Correct schema where needed, meaningful indexes, predictable queries, safe migrations and practical caching.</text><rect x="46" y="212" width="338" height="160" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="62" y="239" font-family="monospace" font-size="18" fill="#9cdfff">RELATIONAL</text><text x="62" y="261" font-family="monospace" font-size="13" fill="#dff4ff">MySQL / PostgreSQL</text><text x="62" y="280" font-family="monospace" font-size="13" fill="#dff4ff">• strong structure</text><text x="62" y="299" font-family="monospace" font-size="13" fill="#dff4ff">• joins and constraints</text><text x="62" y="318" font-family="monospace" font-size="13" fill="#dff4ff">• transactions</text><text x="62" y="337" font-family="monospace" font-size="13" fill="#dff4ff">• long-term core truth</text><rect x="430" y="212" width="338" height="160" rx="12" fill="#151017" stroke="#ff304f"/><text x="446" y="239" font-family="monospace" font-size="18" fill="#ff97a8">DOCUMENT / FLEXIBLE</text><text x="446" y="261" font-family="monospace" font-size="13" fill="#ffe7ec">MongoDB</text><text x="446" y="280" font-family="monospace" font-size="13" fill="#ffe7ec">• flexible record shapes</text><text x="446" y="299" font-family="monospace" font-size="13" fill="#ffe7ec">• nested documents</text><text x="446" y="318" font-family="monospace" font-size="13" fill="#ffe7ec">• content-style data</text><text x="446" y="337" font-family="monospace" font-size="13" fill="#ffe7ec">• rapid schema evolution</text><rect x="814" y="212" width="338" height="160" rx="12" fill="#10131b" stroke="#42b8ff"/><text x="830" y="239" font-family="monospace" font-size="18" fill="#9cdfff">CACHE / MANAGED / REALTIME</text><text x="830" y="261" font-family="monospace" font-size="13" fill="#dff4ff">Redis, SQLite, Firebase, Supabase</text><text x="830" y="280" font-family="monospace" font-size="13" fill="#dff4ff">• cache and sessions</text><text x="830" y="299" font-family="monospace" font-size="13" fill="#dff4ff">• lightweight embedded storage</text><text x="830" y="318" font-family="monospace" font-size="13" fill="#dff4ff">• managed backend tooling</text><text x="830" y="337" font-family="monospace" font-size="13" fill="#dff4ff">• realtime workflows</text><rect x="50" y="404" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="85.0" y="422" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">MySQL</text><rect x="130" y="404" width="100.60000000000001" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="180.3" y="422" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">PostgreSQL</text><rect x="240.60000000000002" y="404" width="76.42" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="278.81" y="422" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">MongoDB</text><rect x="327.02000000000004" y="404" width="70" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="362.02000000000004" y="422" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Redis</text><rect x="407.02000000000004" y="404" width="70" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="442.02000000000004" y="422" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">SQLite</text><rect x="487.02000000000004" y="404" width="84.48" height="28" rx="14" fill="#0d1622" stroke="#42b8ff"/><text x="529.26" y="422" text-anchor="middle" font-family="monospace" font-size="13" fill="#dff4ff">Firebase</text><rect x="581.5" y="404" width="84.48" height="28" rx="14" fill="#170d14" stroke="#ff304f"/><text x="623.74" y="422" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffdbe2">Supabase</text><text x="50" y="456" font-family="monospace" font-size="14" fill="#ecf6ff">Practical model: SQL stores core truth, Redis accelerates hot paths, flexible stores support changing shapes, managed services reduce setup time.</text></svg>