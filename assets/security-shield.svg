<svg xmlns="http://www.w3.org/2000/svg" width="295" height="300" viewBox="0 0 295 300">
<rect width="295" height="300" rx="18" fill="#06070b" stroke="#415171"/>
<text x="42" y="38" font-family="monospace" font-size="18" fill="#ff3150">SECURITY SHIELD // SYSTEM CHECKPOINT</text>
<g transform="translate(220 160)"><path d="M0-72 L54-50 V-6 C54 42 21 72 0 85 C-21 72 -54 42 -54 -6 V-50 Z" fill="#11141f" stroke="#46b6ff" stroke-width="4"/><path d="M0-54 L26-42 V-11 C26 17 9 34 0 43 C-9 34 -26 17 -26 -11 V-42 Z" fill="#ff3150" opacity=".22"/><animateTransform attributeName="transform" type="scale" values="1;1.04;1" dur="2.1s" repeatCount="indefinite"/></g><text x="360" y="100" font-family="monospace" font-size="16" fill="#98dcff">1. VALIDATION      → reject malformed input</text><text x="360" y="130" font-family="monospace" font-size="16" fill="#ffc5cf">2. AUTHENTICATION  → identify the actor</text><text x="360" y="160" font-family="monospace" font-size="16" fill="#98dcff">3. AUTHORIZATION   → verify permissions</text><text x="360" y="190" font-family="monospace" font-size="16" fill="#ffc5cf">4. SECRETS         → keep credentials out of code</text><text x="360" y="220" font-family="monospace" font-size="16" fill="#98dcff">5. SAFE DEFAULTS   → deny by default</text><text x="360" y="250" font-family="monospace" font-size="16" fill="#ffc5cf">6. LOGGING         → observe suspicious behavior</text></svg>