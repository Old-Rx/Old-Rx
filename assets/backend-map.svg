<g fill="none" stroke="#ff314f" stroke-width="3"><path d="M186 147H224M362 147H400M538 147H576M714 147H752M890 147H928"/></g>
<g fill="#ffffff" stroke="#ff314f" stroke-width="3"><circle r="6"><animateMotion path="M186 147H1066" dur="6.4s" repeatCount="indefinite"/></circle></g>
<text x="60" y="250" font-family="monospace" font-size="14" fill="#ff7c8d">Node / Express / NestJS, Python / Django / FastAPI, Java / Spring, Go, Rust and .NET all fit here depending on scale, performance and ecosystem needs.</text>
<text x="60" y="274" font-family="monospace" font-size="14" fill="#ff7c8d">The important part is the flow: route → auth → validation → logic → data → response.</text>
