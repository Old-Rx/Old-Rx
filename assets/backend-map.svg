<text x="42" y="38" font-family="monospace" font-size="18" fill="#ff334f">BACKEND MAP // REQUEST LIFECYCLE</text>
<g font-family="monospace" font-size="13">
  <rect x="48" y="104" width="138" height="86" rx="12" fill="#12080a" stroke="#620014"/><text x="78" y="132" font-size="17" fill="#ff7184">ROUTER</text><text x="78" y="157" fill="#ffbac3">path matching</text><text x="78" y="175" fill="#ffbac3">method handling</text>
  <rect x="224" y="104" width="138" height="86" rx="12" fill="#12080a" stroke="#620014"/><text x="242" y="132" font-size="17" fill="#ff7184">AUTH</text><text x="242" y="157" fill="#ffbac3">sessions</text><text x="242" y="175" fill="#ffbac3">tokens / roles</text>
  <rect x="400" y="104" width="138" height="86" rx="12" fill="#12080a" stroke="#620014"/><text x="416" y="132" font-size="17" fill="#ff7184">VALIDATION</text><text x="416" y="157" fill="#ffbac3">payload rules</text><text x="416" y="175" fill="#ffbac3">sanitization</text>
  <rect x="576" y="104" width="138" height="86" rx="12" fill="#12080a" stroke="#620014"/><text x="597" y="132" font-size="17" fill="#ff7184">LOGIC</text><text x="597" y="157" fill="#ffbac3">services</text><text x="597" y="175" fill="#ffbac3">business rules</text>
  <rect x="752" y="104" width="138" height="86" rx="12" fill="#12080a" stroke="#620014"/><text x="776" y="132" font-size="17" fill="#ff7184">DATA</text><text x="776" y="157" fill="#ffbac3">ORM / queries</text><text x="776" y="175" fill="#ffbac3">cache / queues</text>
  <rect x="928" y="104" width="138" height="86" rx="12" fill="#12080a" stroke="#620014"/><text x="950" y="132" font-size="17" fill="#ff7184">RESPONSE</text><text x="950" y="157" fill="#ffbac3">JSON / errors</text><text x="950" y="175" fill="#ffbac3">status / headers</text>
