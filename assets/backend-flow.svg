SE</text><text x="945" y="158" font-family="monospace" font-size="13" fill="#e7f7ff">JSON / errors</text><text x="945" y="176" font-family="monospace" font-size="13" fill="#e7f7ff">headers / status</text><path d="M186 150H219" fill="none" stroke="#46b6ff" stroke-width="3"/><path d="M363 150H396" fill="none" stroke="#ff3150" stroke-width="3"/><path d="M540 150H573" fill="none" stroke="#46b6ff" stroke-width="3"/><path d="M717 150H750" fill="none" stroke="#ff3150" stroke-width="3"/><path d="M894 150H927" fill="none" stroke="#46b6ff" stroke-width="3"/><g fill="#fff"><circle r="6" stroke="#46b6ff" stroke-width="3"><animateMotion path="M186 150H1071" dur="6.4s" repeatCount="indefinite"/></circle></g><text x="50" y="258" font-family="monospace" font-size="14" fill="#caecff">Framework examples: Node/Express/NestJS, Python/Django/FastAPI, Java/Spring, Go, Rust, C#/.NET.</text><text x="50" y="282" font-family="monospace" font-size="14" fill="#ffc5cf">Principle: route → auth → validation → logic → data → response.</text></svg>