0" stroke-width="3"/><path d="M512 154H544" fill="none" stroke="#46b6ff" stroke-width="3"/><path d="M676 154H708" fill="none" stroke="#ff3150" stroke-width="3"/><path d="M840 154H872" fill="none" stroke="#46b6ff" stroke-width="3"/><path d="M1004 154H1036" fill="none" stroke="#ff3150" stroke-width="3"/><g fill="#fff"><circle r="6" stroke="#46b6ff" stroke-width="3"><animateMotion path="M184 154H1148" dur="7.1s" repeatCount="indefinite"/></circle></g><text x="60" y="265" font-family="monospace" font-size="14" fill="#caecff">Goal: make the path from code to production visible, repeatable and safe to improve.</text><text x="60" y="288" font-family="monospace" font-size="14" fill="#ffc5cf">Examples: GitHub Actions / Jenkins, Docker, Linux, NGINX, Prometheus, Grafana.</text></svg>